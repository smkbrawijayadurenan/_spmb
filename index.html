<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPMB - SMK BRAWIJAYA DURENAN</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Target Full Layer Iframe */
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Luxury Glassmorphism Loading Overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Multi-Color Concentric Neon Spinner */
    .spinner-box {
      position: relative;
      width: 90px;
      height: 90px;
      margin-bottom: 28px;
    }

    .spinner-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid transparent;
      border-top-color: #00f2fe; /* Cyan Neon */
      border-right-color: #4facfe;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));
    }

    .spinner-ring:nth-child(2) {
      width: 75%;
      height: 75%;
      top: 12.5%;
      left: 12.5%;
      border-top-color: #f093fb; /* Magenta Neon */
      border-right-color: #f5576c;
      animation: spin-reverse 0.9s linear infinite;
      filter: drop-shadow(0 0 8px rgba(240, 147, 251, 0.6));
    }

    .spinner-ring:nth-child(3) {
      width: 50%;
      height: 50%;
      top: 25%;
      left: 25%;
      border-top-color: #43e97b; /* Emerald / Gold Neon */
      border-right-color: #38f9d7;
      animation: spin 1.5s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(67, 233, 123, 0.6));
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(-360deg); }
    }

    /* Dynamic Luxury Text Styling */
    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .loading-text {
      color: #38bdf8;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-height: 24px;
      text-align: center;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .loading-text.fade-out {
      opacity: 0;
      transform: translateY(-4px);
    }
  </style>
</head>
<body>

  <!-- Overlay Loader Berwarna-Warni & Mewah -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner-box">
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
    </div>
    <div class="brand-title">SMK BRAWIJAYA DURENAN</div>
    <div id="dynamicText" class="loading-text">Menyiapkan Aplikasi...</div>
  </div>

  <!-- Google Apps Script Iframe -->
  <iframe 
    id="appIframe"
    src="https://script.google.com/macros/s/AKfycbx8cyK6tjPWKQ2EECVEeXp29g6Zjx3I_YuU7XIumouos6YQjAyfyu2_ZbGhaTKXPNNO/exec"
    allow="fullscreen">
  </iframe>

  <script>
    // Teks Pergantian Status Memuat
    const statusTexts = [
      "SMK Bisa...",
      "SMK Hebat...",
      "SMK Brawijaya Luarbiasa...",
      "Hampir Selesai..."
    ];

    let currentTextIdx = 0;
    const textElement = document.getElementById("dynamicText");
    const overlayElement = document.getElementById("loadingOverlay");
    const iframeElement = document.getElementById("appIframe");

    // Efek Teks Berganti Tiap 1.5 Detik
    const textInterval = setInterval(() => {
      textElement.classList.add("fade-out");
      setTimeout(() => {
        currentTextIdx = (currentTextIdx + 1) % statusTexts.length;
        textElement.innerText = statusTexts[currentTextIdx];
        textElement.classList.remove("fade-out");
      }, 250);
    }, 1500);

    // Hilangkan Loader Setelah Iframe Selesai Memuat
    iframeElement.onload = function() {
      setTimeout(() => {
        clearInterval(textInterval);
        overlayElement.classList.add("hidden");
      }, 600);
    };

    // Safety Timeout (Maksimal 8 Detik Otomatis Terbuka)
    setTimeout(() => {
      clearInterval(textInterval);
      overlayElement.classList.add("hidden");
    }, 8000);
  </script>

</body>
</html>
